<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>MR Travels & Tours | Sri Lanka Private Car Tours & Chauffeur Guide</title>
    <meta name="title" content="MR Travels & Tours | Sri Lanka Private Car Tours & Chauffeur Guide" />
    <meta name="description" content="Discover Sri Lanka in comfort with MR Travels & Tours. Dedicated private car day tours to Sigiriya Lion Rock, Ella Nine Arches, Kandy, Nuwara Eliya, Batticaloa & Polonnaruwa." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mrtravels.lk/" />
    <meta property="og:title" content="MR Travels & Tours | Authentic Sri Lanka Day Tours" />
    <meta property="og:description" content="Dedicated private car tours across Sri Lanka with MR Travels & Tours. Flexible pacing, insider spots, and personalized hospitality." />
    <meta property="og:image" content="/images/destinations/sigiriya.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Theme script to prevent flash and enforce theme immediately -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mrtravels_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-stone-900 dark:bg-[#051810] dark:text-[#fbf9f4] selection:bg-[#e5a93c] selection:text-[#051810] antialiased overflow-x-hidden transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
